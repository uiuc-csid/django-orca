name: Test Project

on: [push]

permissions:
  contents: read

env:
  TEST_REPORT_LOCATION: tmp/pytest-report.xml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install python packages
        run: uv sync --locked --all-extras
      - name: Ruff
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests

  test:
    name: Test (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads coverage to Codecov with OIDC instead of a token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['4.2', '5.2', '6.1']
        exclude:
          # Django 4.2 supports Python 3.8 to 3.12.
          - django: '4.2'
            python: '3.13'
          - django: '4.2'
            python: '3.14'
          # Django 6.x needs Python 3.12 or later.
          - django: '6.1'
            python: '3.10'
          - django: '6.1'
            python: '3.11'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install python packages
        run: |
          uv sync --locked --all-extras
          uv pip install "django~=${{ matrix.django }}.0"
      - name: Run tests
        # --no-sync keeps the Django version installed above.
        run: uv run --no-sync pytest --junit-xml=${{ env.TEST_REPORT_LOCATION }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-python-${{ matrix.python }}-django-${{ matrix.django }}
          path: ${{ env.TEST_REPORT_LOCATION }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: tmp/coverage.xml
          flags: python-${{ matrix.python }},django-${{ matrix.django }}
          use_oidc: true

  publish-test-results:
    name: Publish test results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*
          path: test-results
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test-results/**/*.xml
