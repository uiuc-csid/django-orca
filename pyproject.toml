[project]
name = "django-orca"
version = "0.0.1"
description = "A role-based access control backend for django"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Josh Asplund", email = "asplund3@illinois.edu" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>4.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.13.0,<4"]

[dependency-groups]
dev = [
    "ipython",
    "mypy",
    "mypy-extensions",
    "django-stubs",
    "django-extensions",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "rope",
    "pyparsing",
    "pydot",
    "black",
    "django-migration-linter",
    "pre-commit",
    "nplusone",
    "django-heavy-water>=0.3.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
junit_family = "xunit2"
DJANGO_SETTINGS_MODULE = "tests.example_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov-report html --cov-report xml --cov"

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]

allow_redefinition = false
check_untyped_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
local_partial_types = true
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true

# Django migrations should not produce any errors:
[[tool.mypy.overrides]]
module = [
    "tests.example_project.main.migrations",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.example_project.settings"

[tool.coverage.run]
branch = true
source = [
    "django_orca"
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/fixtures.py",
    "*/management/commands/*",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["**/migrations/**"]
# Apply the excludes to files passed explicitly, e.g. by pre-commit.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "DJ"]
ignore = ["E501"]
